<div class="app">
  <main class="pg">

    <!-- Activity list -->
    <section id="view-list" class="vw">
      <div class="ph">
        <div>
          <h1>Activities</h1>
          <p>Manage your learning activities, assessments, and practical training.</p>
        </div>
      </div>

      <div class="tabs" id="tabs" role="tablist" aria-label="Activity categories"></div>

      <div class="sum" id="sum"></div>

      <div class="tb">
        <div class="tbl"><h2>Activities</h2><span id="cnt"></span></div>
        <div class="tbr">
          <input id="q" type="search" placeholder="Search activities..." aria-label="Search activities" autocomplete="off">
          <select id="st" aria-label="Filter by status">
            <option value="all">All statuses</option>
            <option>Not Started</option>
            <option>In Progress</option>
            <option>Completed</option>
            <option>Due Soon</option>
          </select>
        </div>
      </div>

      <div class="sec" id="sec" hidden></div>
      <div class="ag" id="grid"></div>
    </section>

    <!-- Activity overview -->
    <section id="view-overview" class="vw" hidden></section>

    <!-- Active quiz / exam / practical session -->
    <section id="view-session" class="vw" hidden></section>

  </main>
</div>

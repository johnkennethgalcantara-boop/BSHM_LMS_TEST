<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" preserveAspectRatio="xMidYMax slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120c3e"/><stop offset=".55" stop-color="#241675"/><stop offset="1" stop-color="#3a2899"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120c3e" stop-opacity="1"/><stop offset=".5" stop-color="#120c3e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#b9a9ff" stop-opacity=".12"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="240" height="280" fill="url(#bg)"/>

  <!-- bokeh lights -->
  <g filter="url(#blur)" fill="#c9b8ff">
    <circle cx="40" cy="120" r="12" opacity=".4"/><circle cx="110" cy="90" r="9" opacity=".35"/>
    <circle cx="190" cy="130" r="14" opacity=".4"/><circle cx="150" cy="170" r="8" opacity=".3"/>
  </g>

  <!-- serving cloche -->
  <g opacity=".55">
    <path d="M30 238 a42 42 0 0 1 84 0 z" fill="url(#glass)" stroke="#d9d0ff" stroke-width="1.2"/>
    <circle cx="72" cy="192" r="4" fill="#d9d0ff"/>
    <rect x="22" y="238" width="100" height="5" rx="2.5" fill="#d9d0ff"/>
  </g>

  <!-- wine glasses -->
  <g opacity=".6">
    <path d="M150 170 h30 q2 28 -15 36 q-17 -8 -15 -36 z" fill="url(#glass)" stroke="#d9d0ff" stroke-width="1"/>
    <rect x="164" y="206" width="2" height="32" fill="#d9d0ff"/>
    <ellipse cx="165" cy="239" rx="13" ry="2.5" fill="#d9d0ff"/>
    <path d="M192 188 h24 q2 22 -12 29 q-14 -7 -12 -29 z" fill="url(#glass)" stroke="#d9d0ff" stroke-width="1"/>
    <rect x="203" y="217" width="2" height="22" fill="#d9d0ff"/>
    <ellipse cx="204" cy="240" rx="10" ry="2" fill="#d9d0ff"/>
  </g>

  <!-- table -->
  <rect y="243" width="240" height="37" fill="#150c4a" opacity=".75"/>
  <rect width="240" height="150" fill="url(#fade)"/>
</svg>

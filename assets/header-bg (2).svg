<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 104" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#150c4a"/><stop offset=".45" stop-color="#3a2899"/><stop offset="1" stop-color="#120a3d"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#b9a9ff" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a63e0" stop-opacity=".5"/><stop offset="1" stop-color="#150c4a" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="104" fill="url(#bg)"/>

  <!-- blurred restaurant lights -->
  <g filter="url(#blur)" fill="#c9b8ff">
    <circle cx="640" cy="22" r="14" opacity=".55"/><circle cx="720" cy="40" r="10" opacity=".4"/>
    <circle cx="820" cy="16" r="16" opacity=".5"/><circle cx="930" cy="34" r="11" opacity=".45"/>
    <circle cx="1040" cy="20" r="13" opacity=".4"/><circle cx="1140" cy="44" r="9" opacity=".35"/>
    <circle cx="520" cy="46" r="9" opacity=".3"/><circle cx="1260" cy="26" r="12" opacity=".35"/>
  </g>

  <!-- table surface -->
  <rect x="520" y="82" width="760" height="22" fill="url(#table)"/>
  <g filter="url(#soft)">
    <!-- folded napkin -->
    <path d="M700 82 L760 54 L820 82 Z" fill="#d9d0ff" opacity=".55"/>
    <path d="M760 54 L760 82 L820 82 Z" fill="#a994f5" opacity=".5"/>
    <!-- plate -->
    <ellipse cx="760" cy="84" rx="62" ry="7" fill="#fff" opacity=".28"/>
    <!-- wine glass 1 -->
    <path d="M880 20 h34 q2 30 -17 38 q-19 -8 -17 -38 z" fill="url(#glass)"/>
    <rect x="896" y="58" width="2" height="22" fill="#fff" opacity=".45"/>
    <ellipse cx="897" cy="82" rx="14" ry="2.5" fill="#fff" opacity=".4"/>
    <!-- wine glass 2 -->
    <path d="M960 28 h30 q2 26 -15 33 q-17 -7 -15 -33 z" fill="url(#glass)" opacity=".85"/>
    <rect x="974" y="61" width="2" height="20" fill="#fff" opacity=".4"/>
    <ellipse cx="975" cy="82" rx="12" ry="2.5" fill="#fff" opacity=".35"/>
    <!-- cutlery -->
    <rect x="660" y="60" width="3" height="24" rx="1.5" fill="#fff" opacity=".4"/>
    <rect x="852" y="60" width="3" height="24" rx="1.5" fill="#fff" opacity=".4"/>
  </g>

  <!-- left/right darkening so text stays readable -->
  <rect width="560" height="104" fill="#120a3d" opacity=".35"/>
  <rect x="1240" width="360" height="104" fill="#120a3d" opacity=".35"/>
</svg>
